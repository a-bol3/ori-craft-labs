services:
  ori-craft-labs-postgres:
    image: postgres:16-alpine
    container_name: ori-craft-labs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ori_craft_labs
      POSTGRES_USER: ori
      POSTGRES_PASSWORD: ori_local_only_change_me
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - ori-craft-labs-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ori -d ori_craft_labs"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ori-craft-labs-postgres-data:
