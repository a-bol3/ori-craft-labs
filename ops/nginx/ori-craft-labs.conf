# Install only after replacing the certificate paths with paths managed by Certbot.
# Each application remains bound to localhost; Nginx is the only public entrypoint.

server {
    listen 80;
    listen [::]:80;
    server_name ori-craftlabs.com www.ori-craftlabs.com;
    return 301 https://ori-craftlabs.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.ori-craftlabs.com;
    ssl_certificate /etc/letsencrypt/live/ori-craftlabs.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ori-craftlabs.com/privkey.pem;
    return 301 https://ori-craftlabs.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ori-craftlabs.com;
    ssl_certificate /etc/letsencrypt/live/ori-craftlabs.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ori-craftlabs.com/privkey.pem;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name app.ori-craftlabs.com;
    return 301 https://app.ori-craftlabs.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.ori-craftlabs.com;
    ssl_certificate /etc/letsencrypt/live/app.ori-craftlabs.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.ori-craftlabs.com/privkey.pem;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

